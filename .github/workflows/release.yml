name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate version metadata
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            node scripts/check-release-version.mjs "$GITHUB_REF_NAME"
          else
            node scripts/check-release-version.mjs
          fi
      - name: Validate release commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Manual release preflight must run from main." >&2
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit must be contained in main." >&2
            exit 1
          fi
  build:
    name: Build unsigned release (${{ matrix.name }})
    needs: preflight
    environment: release
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal
            os: macos-14
            target: universal-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.91.1
          components: clippy,rustfmt
      - name: Add macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
          save-if: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate required signing inputs
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          required=(
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            TAURI_UPDATER_PUBLIC_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing release secrets or variables: ${missing[*]}" >&2
            exit 1
          fi
          echo "All required release inputs are configured."

      - name: Prepare release-only Tauri config
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/prepare-release-config.mjs

      - name: Build updater-signed release assets
        if: github.event_name == 'push'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: EveryBuddy v__VERSION__
          releaseBody: |
            EveryBuddy 0.1.2 improves credential handling and target workflow safety.

            ## Highlights

            - Store API source tokens in EveryBuddy's local SQLite database with private per-user file permissions.
            - Show the saved token when editing an API source, masked by default with an explicit visibility toggle.
            - Commit API source imports, credentials, models, and provenance atomically with clearer recovery when a token is missing.
            - Harden target preview, write, drift detection, and rollback behavior across WorkBuddy and CodeBuddy.

            ## Unsigned Installers

            The macOS and Windows installers are not platform-signed. macOS Gatekeeper and Windows SmartScreen may show an unverified publisher warning.

            Download only from this repository and verify the files against `SHA256SUMS.txt` before installation. Updater assets are signed with a Tauri Ed25519 key.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json --ci

      - name: Build release preflight assets
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target "${{ matrix.target }}" --config src-tauri/tauri.release.conf.json --ci

      - name: Verify macOS bundle output
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/universal-apple-darwin/release/bundle"
          app_path="$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$app_path"
          dmg_path="$(find "$bundle_root/dmg" -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          test -n "$dmg_path"
          signature_path="$(find "$bundle_root" -name '*.sig' -type f -print -quit)"
          test -n "$signature_path"

      - name: Verify Windows installer output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          $installers = Get-ChildItem $bundleRoot -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' }
          if (-not $installers) {
            throw 'No Windows installers were generated.'
          }
          $signatures = Get-ChildItem $bundleRoot -Recurse -Filter '*.sig' -File
          if (-not $signatures) {
            throw 'No Windows updater signatures were generated.'
          }

  verify-assets:
    name: Verify draft release assets
    needs: build
    if: github.event_name == 'push'
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download draft assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets
          gh release view "$GITHUB_REF_NAME" --json isDraft \
            --jq 'if .isDraft then "draft" else error("release is not a draft") end'
      - name: Verify updater manifest and signatures
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -name '*.dmg' -type f | wc -l)" -ge 1
          test "$(find release-assets -maxdepth 1 \( -name '*.msi' -o -name '*.exe' \) -type f | wc -l)" -ge 1
          test -s release-assets/latest.json
          test "$(find release-assets -maxdepth 1 -name '*.sig' -type f | wc -l)" -ge 2
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('release-assets/latest.json', 'utf8'));
          const platforms = Object.keys(manifest.platforms ?? {});
          if (!platforms.some((name) => name.includes('darwin'))) {
            throw new Error('latest.json does not contain a macOS updater artifact');
          }
          if (!platforms.some((name) => name.includes('windows'))) {
            throw new Error('latest.json does not contain a Windows updater artifact');
          }
          for (const entry of Object.values(manifest.platforms)) {
            if (!entry.signature || !entry.url) {
              throw new Error('latest.json contains an incomplete updater entry');
            }
          }
          NODE
      - name: Generate and upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          checksum_path="$RUNNER_TEMP/SHA256SUMS.txt"
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #'
          ) > "$checksum_path"
          mv "$checksum_path" SHA256SUMS.txt
          test -s SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*
            SHA256SUMS.txt
