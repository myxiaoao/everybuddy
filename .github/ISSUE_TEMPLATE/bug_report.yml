name: Bug Report
description: 报告可复现的错误或异常行为
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索已有 Issue，并确认没有提交 Token、models.json 或未经脱敏的日志。
          required: true
  - type: input
    attributes:
      label: EveryBuddy 版本
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 操作系统
      options: [macOS, Windows]
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 受影响的 Target
      multiple: true
      options: [WorkBuddy, CodeBuddy, API Gateway, UI, Updater, 其他]
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 选择……
        3. 出现……
    validations:
      required: true
  - type: textarea
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 已脱敏的诊断信息
      description: 不要粘贴 Token、Authorization Header、models.json 或完整数据库。
